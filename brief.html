<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GTR 업무 브리핑</title>
<style>
  :root{--bg:#FCFBF8;--card:#FFFFFF;--ink:#26262B;--soft:#666670;--hair:#ECE9E3;--accent:#5B5BD6;--accent2:#2F8FD8;--err:#D9512C;--field:#F6F5F2;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#16161A;--card:#1F1F24;--ink:#EDEDF0;--soft:#A3A3AD;--hair:#2D2D33;--accent:#7C7CF0;--accent2:#4FA3EE;--err:#FF7A55;--field:#26262C;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}

  /* 로그인 */
  .login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
  .card{width:min(380px,100%);background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:30px 26px 26px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 20px 40px -24px rgba(40,28,18,.35)}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:0 8px 18px -8px var(--accent)}
  h1{font-size:21px;margin:16px 0 4px;letter-spacing:-.01em}
  .sub{margin:0 0 22px;font-size:14px;color:var(--soft);line-height:1.55}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  input{width:100%;height:46px;border:1px solid var(--hair);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;margin-bottom:14px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{font:inherit;cursor:pointer}
  .go{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;margin-top:4px;box-shadow:0 10px 22px -12px var(--accent)}
  .go[disabled]{opacity:.65;cursor:default}
  .msg{min-height:20px;margin:12px 0 0;font-size:13.5px;color:var(--err);line-height:1.5}
  .hint{margin:16px 0 0;font-size:12.5px;color:var(--soft);line-height:1.55}

  /* 브리핑 */
  .view{height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));border-bottom:1px solid var(--hair);background:var(--card);font-size:13.5px}
  .bar b{font-weight:700}
  .bar .when{color:var(--soft)}
  .bar .sp{flex:1}
  .btn{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:var(--bg);color:var(--ink);font-size:13px;font-weight:600}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  iframe{flex:1;width:100%;border:0;background:var(--bg)}
  .empty{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--soft);font-size:15px;line-height:1.6}
  @media (max-width:520px){.bar .when{display:none}}
</style>
</head>
<body>

<section class="login" id="login">
  <form class="card" id="form" autocomplete="on">
    <div class="logo">GTR</div>
    <h1>업무 브리핑</h1>
    <p class="sub">업무캘린더 아이디와 비밀번호로 로그인하면 오늘의 브리핑이 열려요.</p>
    <label for="uid">아이디</label>
    <input id="uid" name="username" autocomplete="username" required>
    <label for="upw">비밀번호</label>
    <input id="upw" name="password" type="password" autocomplete="current-password" required>
    <button class="go" id="go" type="submit">로그인</button>
    <p class="msg" id="msg" role="alert"></p>
    <p class="hint">로그인은 이 기기에서 30일 동안 유지돼요.</p>
  </form>
</section>

<section class="view" id="view" hidden>
  <div class="bar">
    <b id="who">브리핑</b><span class="when" id="when"></span>
    <span class="sp"></span>
    <button class="btn" id="reload" type="button">새로 불러오기</button>
    <button class="btn" id="logout" type="button">로그아웃</button>
  </div>
  <iframe id="frame" title="오늘의 업무 브리핑" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
  <div class="empty" id="empty" hidden></div>
</section>

<script>
(function(){
  var API='https://hypqqmdieswabqiensed.supabase.co/functions/v1/briefing', KEY='gtr-brief-token';
  var $=function(id){return document.getElementById(id)};
  var shownAt=null;
  function store(t){try{t?localStorage.setItem(KEY,t):localStorage.removeItem(KEY)}catch(e){}}
  function token(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function call(body){
    return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(j){j._status=r.status;return j})});
  }
  function fmt(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d)) return '';
    var h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
    return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+(h<12?'오전 ':'오후 ')+((h%12)||12)+':'+m+' 업데이트';
  }
  function showLogin(text){
    $('view').hidden=true; $('login').hidden=false; $('msg').textContent=text||''; $('go').disabled=false;
    setTimeout(function(){$('uid').focus()},0);
  }
  function show(j){
    $('login').hidden=true; $('view').hidden=false;
    $('who').textContent=j.label?('브리핑 · '+j.label):'브리핑';
    if(j.html){
      $('empty').hidden=true; $('frame').hidden=false;
      if(j.built_at!==shownAt){ $('frame').srcdoc=j.html; shownAt=j.built_at; }
      $('when').textContent=fmt(j.built_at);
    }else{
      $('frame').hidden=true; $('empty').hidden=false;
      $('empty').textContent=j.message||'아직 만들어진 브리핑이 없어요.';
      $('when').textContent='';
    }
  }
  function load(){
    var t=token(); if(!t){showLogin();return}
    $('reload').disabled=true;
    call({action:'get',token:t}).then(function(j){
      $('reload').disabled=false;
      if(j._status===401){store(null);showLogin('로그인이 만료됐어요. 다시 로그인해 주세요.');return}
      if(j._status>=500||j._status===403){show({label:j.label,message:j.message||'브리핑을 불러오지 못했어요.'});return}
      show(j);
    }).catch(function(){ $('reload').disabled=false; if($('view').hidden) showLogin('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); });
  }
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var id=$('uid').value.trim(), pw=$('upw').value;
    if(!id||!pw){$('msg').textContent='아이디와 비밀번호를 입력해 주세요.';return}
    $('go').disabled=true; $('msg').textContent='';
    call({action:'login',id:id,pw:pw}).then(function(j){
      $('go').disabled=false;
      if(!j.token){$('msg').textContent=j.message||'로그인하지 못했어요.';return}
      store(j.token); $('upw').value=''; show(j);
    }).catch(function(){ $('go').disabled=false; $('msg').textContent='서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'; });
  });
  $('reload').addEventListener('click',load);
  $('logout').addEventListener('click',function(){store(null);shownAt=null;$('frame').srcdoc='';showLogin()});
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && !$('view').hidden) load(); });
  setInterval(function(){ if(!document.hidden && !$('view').hidden) load(); },10*60*1000);
  load();
})();
</script>
</body>
</html>
